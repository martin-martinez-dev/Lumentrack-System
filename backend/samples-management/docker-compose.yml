name: lumentrack-system
services:
  lumentrack-samples-service:
    build:
      context: ../  # <- Sube al directorio raíz 'backend' para alcanzar los componentes hermanos
      dockerfile: samples-management/Dockerfile # <- Apunta a la ubicación exacta del Dockerfile
    image: lumentrack-samples-api:0.2
    container_name: lumentrack-samples-backend-api
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      # Variables de entorno para la base de datos
      - AIVEN_DB_URL=${AIVEN_DB_URL}
      - AIVEN_DB_USER=${AIVEN_DB_USER}
      - AIVEN_DB_PASSWORD=${AIVEN_DB_PASSWORD}
      # Variables de entorno para Cloudinary
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_KEY=${CLOUDINARY_KEY}
      - CLOUDINARY_SECRET=${CLOUDINARY_SECRET}
      # Variables de entorno para JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    # --- CONFIGURACIÓN DEL HEALTHCHECK ---
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always