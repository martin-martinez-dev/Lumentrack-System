plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6' // Versión actualizada a 4.0.6
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lumentrack'
version = '0.0.1-SNAPSHOT'
description = 'dashboard-management'

springBoot {
	buildInfo()
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	mavenLocal() // Para encontrar lumentrack-commons
}

dependencies {
	// Módulo común de Lumentrack
	implementation 'com.lumentrack:lumentrack-commons:0.0.1-SNAPSHOT'

	// Spring Boot Starters esenciales para un microservicio web y Resource Server
	implementation 'org.springframework.boot:spring-boot-starter-webmvc' // Incluye funcionalidades web
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // Para persistencia con JPA
	implementation 'org.springframework.boot:spring-boot-starter-validation' // Para validación de datos
	implementation 'org.springframework.boot:spring-boot-starter-security' // **ESENCIAL para Resource Server**
	implementation 'org.springframework.boot:spring-boot-starter-actuator' // Para monitoreo y gestión

	// JWT (JSON Web Token) para la validación local del token
	implementation platform('io.jsonwebtoken:jjwt-root:0.12.6') // Alinea todas las dependencias JJWT a la versión 0.12.6
	implementation 'io.jsonwebtoken:jjwt-api'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl' // Implementación de JJWT
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson' // Para el procesamiento de JSON en JWT

	// Base de datos y utilidades
	runtimeOnly 'com.mysql:mysql-connector-j' // Driver de MySQL

	// Lombok para reducir el código repetitivo (boilerplate)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Para el uso de MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    // Procesador de anotaciones
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    // Asegurar la comunicación entre lombok y mapstruct
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	// Dependencias de testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test' // Para pruebas de seguridad
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' // Para pruebas de la capa web
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    // 1. Configuración para tus Mappers
    options.compilerArgs << "-Amapstruct.defaultComponentModel=spring"
    
    // 2. Asegura cumplimiento estricto de la versión 25
    options.release = 25
    
    // 3. Opcional: Ayuda a debuguear problemas de encoding en Docker (Ubuntu Noble)
    options.encoding = 'UTF-8'
}

bootJar {
    archiveFileName = 'lumentrack-dashboard-backend.jar'
}

jar {
    enabled = false
}