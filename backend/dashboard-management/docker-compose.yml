name: lumentrack-system
services:
  lumentrack-dashboard-service:
    build:
      context: ../  # <- Indispensable: Sube un nivel para que Docker pueda "ver" lumentrack-commons
      dockerfile: dashboard-management/Dockerfile # <- Ruta al Dockerfile desde la raíz backend
    image: lumentrack-dashboard-api:0.2
    container_name: lumentrack-dashboard-backend-api
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # Variables de entorno para la base de datos
      - AIVEN_DB_URL=${AIVEN_DB_URL}
      - AIVEN_DB_USER=${AIVEN_DB_USER}
      - AIVEN_DB_PASSWORD=${AIVEN_DB_PASSWORD}
      # Variables de entorno para JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    # --- CONFIGURACIÓN DEL HEALTHCHECK ---
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always